<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Riaya | رعاية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Riaya">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<style>
body { display: flex; flex-direction: column; min-height: 100vh; }
.chat { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 16px 16px 8px; }
.bubble { width: fit-content; max-width: 85%; padding: 14px 18px; border-radius: 22px; margin: 8px 0; line-height: 1.6; white-space: pre-line; }
.bot { background: var(--surface); box-shadow: var(--shadow); border-start-start-radius: 6px; }
.me { background: var(--brand); color: var(--brand-ink); margin-inline-start: auto; border-start-end-radius: 4px; }
.me small { opacity: .8; }
.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px 14px; }
.dock .inner { max-width: 720px; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chips .opt { background: var(--surface); }
.inputrow { display: flex; gap: 8px; align-items: center; }
.mic { width: 54px; height: 54px; border-radius: 50%; border: 0; background: radial-gradient(120% 120% at 30% 20%, #2a4361, #0d1b2a); color: var(--brand-ink); font-size: 22px; cursor: pointer; flex: none; }
.mic.live { background: var(--alert); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(179,57,47,.5); } 100% { box-shadow: 0 0 0 14px rgba(179,57,47,0); } }
.settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.settings select { width: auto; padding: 6px 8px; }
.typing { color: var(--muted); font-size: 13px; }
.vset { position: relative; }
.vset summary { text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--ink-2); }
.vpanel { position: absolute; inset-inline-end: 0; top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; width: 280px;
  display: flex; flex-direction: column; gap: 10px; z-index: 10; }
.vpanel select { width: 100%; }
.startpad { display: flex; flex-direction: column; gap: 12px; align-items: stretch; max-width: 320px; margin: 18vh auto 0; }
.bot { border: 1px solid var(--line); box-shadow: none; }
.mic { background: var(--gulf) !important; }
.mic.live { background: var(--alert) !important; }
/* seamless conversation */
.bubble { opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .32s ease, transform .32s cubic-bezier(.2,.8,.2,1); }
.bubble.in { opacity: 1; transform: none; }
.bubble.typing { padding: 14px 18px; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.chips .opt { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress b { display: block; height: 100%; width: 0; background: var(--brand); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.statusrow { display: flex; align-items: center; gap: 10px; min-height: 22px; margin-bottom: 6px; padding-right: 52px; }
.orb { position: relative; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
.orb i { width: 3px; height: 6px; border-radius: 2px; background: var(--brand); opacity: .35; transition: height .2s, opacity .2s; }
.orb[data-state="speaking"] i, .orb[data-state="listening"] i { opacity: 1; animation: wave .9s infinite ease-in-out; }
.orb[data-state="listening"] i { background: var(--alert); }
.orb[data-state="thinking"] i { opacity: .8; animation: blink 1s infinite; }
.orb i:nth-child(2) { animation-delay: .12s !important; } .orb i:nth-child(3) { animation-delay: .24s !important; }
@keyframes wave { 0%, 100% { height: 6px; } 50% { height: 18px; } }
.orb.big { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%); gap: 5px; }
.orb.big i { width: 6px; height: 14px; }
.orb.big[data-state="speaking"] i { animation: wavebig .9s infinite ease-in-out; }
@keyframes wavebig { 0%, 100% { height: 14px; } 50% { height: 46px; } }
.langpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.langcard { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 10px; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; transition: border-color .2s, transform .2s; min-height: 44px; }
.langcard b { font-size: 1.25em; } .langcard span { font-size: .8em; color: var(--muted); }
.langcard.on { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.langcard:focus-visible, .opt:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.accents { justify-content: center; }
.startpad { max-width: 360px; margin: 8vh auto 0; }
.startpad > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .bubble, .chips .opt, .startpad > *, .orb i, .dots i { animation: none !important; transition: none !important; opacity: 1; transform: none; } }
</style>
</head>
<body class="has-dock">
<a class="skip-link" href="#log">Skip to content</a>
<header class="top"><div class="brand"><i></i><a href="index.html" style="color:inherit;text-decoration:none" id="brand"></a></div><div class="spacer"></div>
  <div class="settings">
    <details class="vset"><summary id="lblVoice"></summary>
      <div class="vpanel">
        <label><input type="checkbox" id="voiceOn" checked> <span>🔊</span></label>
        <select id="voice" aria-label="voice"></select>
        <label><input type="checkbox" id="handsFree"> <span id="lblHands"></span></label>
        <label><input type="checkbox" id="private"> <span id="lblPrivate"></span></label>
        <div class="muted small" id="voiceNote"></div>
      </div></details>
    <button class="chip" id="langBtn"></button>
  </div>
</header>
<main class="chat" id="log" aria-live="polite"></main>
<div class="dock" id="dock"><div class="inner">
  <div class="progress" aria-hidden="true"><b id="prog"></b></div>
  <div class="statusrow"><span class="orb" id="orb" data-state="idle" aria-hidden="true"><i></i><i></i><i></i></span><span class="small muted" id="orbLabel" role="status"></span>
    <span class="spacer" style="flex:1"></span><span class="small muted" id="progLabel"></span></div>
  <div class="chips" id="chips"></div>
  <div class="inputrow">
    <button class="mic" id="mic" aria-label="speak"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f1ece3" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input type="text" id="text" autocomplete="off">
    <button class="btn" id="send"></button>
  </div>
  <div class="muted small" id="micNote" style="margin-top:6px"></div>
</div></div>
<script src="js/common.js?v=3"></script>
<script src="js/lock.js?v=6" data-scope="user"></script>
<script src="js/i18n.js?v=2"></script>
<script src="js/nlu.js?v=5"></script>
<script src="js/voice.js?v=4"></script>
<script src="js/chat.js?v=8"></script>
</body>
</html>
